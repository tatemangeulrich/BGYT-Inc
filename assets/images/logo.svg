<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <linearGradient id="bgyt-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0266FF" />
    </linearGradient>
    <linearGradient id="bgyt-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Geometric Crest Icon -->
  <g transform="translate(6, 7)">
    <!-- Hexagonal cyber crest -->
    <polygon points="28,2 54,16 54,42 28,56 2,42 2,16" fill="#0A0E18" stroke="#00D2FF" stroke-width="2" />
    <polygon points="28,8 48,19 48,39 28,50 8,39 8,19" fill="#171B26" opacity="0.6" />
    <!-- Quantum core lines -->
    <path d="M28 8 L28 28 L48 39" stroke="url(#bgyt-cyan-grad)" stroke-width="3" stroke-linecap="round" />
    <path d="M28 28 L8 39" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="28" cy="28" r="4.5" fill="#00D2FF" filter="url(#neon-glow)" />
    <!-- Tech dots -->
    <circle cx="2" cy="16" r="2" fill="#00D2FF" />
    <circle cx="54" cy="16" r="2" fill="#00D2FF" />
    <circle cx="28" cy="56" r="2" fill="#0266FF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 46)">
    <!-- Main BGYT Text -->
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="0.05em" fill="#FFFFFF">
      BGYT
    </text>
    <!-- Cyan Dot / Notch -->
    <circle cx="106" cy="-10" r="4" fill="url(#bgyt-cyan-grad)" filter="url(#neon-glow)" />
    <!-- Inc Text -->
    <text x="116" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="600" fill="#00D2FF">
      INC
    </text>
    <!-- Trademark Symbol -->
    <text x="172" y="-14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#859399">
      TM
    </text>
  </g>

  <!-- Subtitle Ribbon -->
  <text x="76" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.28em" fill="#859399">
    GAMING STUDIO &amp; CYBER SYSTEMS
  </text>
</svg>
